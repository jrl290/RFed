[package]
name = "rfed"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rfed"
path = "src/main.rs"

[dependencies]
reticulum_rust = { path = "../../Reticulum-rust", default-features = false }
# lxmf_rust's default feature re-enables reticulum_rust/serial, which drags in
# btleplug -> libdbus-sys and breaks the musl cross-build.
lxmf_rust      = { path = "../../LXMF-rust", default-features = false }
app_links      = { path = "../../app-links" }

rmp          = "0.8.14"
rmpv         = "=1.0.0"
rmp-serde    = "1.1"
serde        = { version = "1.0", features = ["derive"] }
configparser = "3"
sha2       = "0.10"
rand       = "0.8"
once_cell  = "1.19"
base64     = "0.22"
# "termination" makes the existing SIGINT handler ALSO fire on SIGTERM/SIGHUP,
# so `docker stop` (SIGTERM) triggers the graceful shutdown path instead of
# escalating to a forced SIGKILL teardown. Without this feature the handler is
# SIGINT-only and RFed ignores SIGTERM entirely.
ctrlc      = { version = "3.4", features = ["termination"] }

# Must be pinned to match reticulum_rust's transitive deps exactly.
x25519-dalek = "=1.1.1"
ed25519-dalek = "=1.0.1"
