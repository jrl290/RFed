[package]
name = "rfed"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rfed"
path = "src/main.rs"

[dependencies]
reticulum_rust = { path = "../../Reticulum-rust", default-features = false }
lxmf_rust      = { path = "../../LXMF-rust" }
app_links      = { path = "../../app-links" }

rmp          = "0.8.14"
rmpv         = "=1.0.0"
rmp-serde    = "1.1"
serde        = { version = "1.0", features = ["derive"] }
configparser = "3"
sha2       = "0.10"
rand       = "0.8"
once_cell  = "1.19"
base64     = "0.22"
ctrlc      = "3.4"

# Must be pinned to match reticulum_rust's transitive deps exactly.
x25519-dalek = "=1.1.1"
ed25519-dalek = "=1.0.1"
