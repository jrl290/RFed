name: Release rfed binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_target }} release asset
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_target: linux-x86_64
            binary_path: target/x86_64-unknown-linux-musl/release/rfed
            install_linux_deps: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_target: linux-arm64
            binary_path: target/aarch64-unknown-linux-musl/release/rfed
            install_linux_deps: true
          - os: macos-14
            target: aarch64-apple-darwin
            asset_target: darwin-arm64
            binary_path: target/aarch64-apple-darwin/release/rfed
            install_linux_deps: false

    steps:
      - name: Checkout RFed-rust (this repo)
        uses: actions/checkout@v4

      - name: Bootstrap sibling dependencies (outside workspace)
        run: |
          ./scripts/bootstrap-sibling-deps.sh \
            --deps-root "${{ github.workspace }}/.." \
            --disable-lxmf-reticulum-default-features

      - name: Install Linux release toolchain dependencies
        if: ${{ matrix.install_linux_deps }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools perl pkg-config

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rfed-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rfed-release-${{ matrix.target }}-

      - name: Build Linux release binary
        if: ${{ matrix.install_linux_deps }}
        run: |
          target_env_key="$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          env "CARGO_TARGET_${target_env_key}_LINKER=musl-gcc" \
            cargo build --release --target ${{ matrix.target }} -p rfed

      - name: Build macOS release binary
        if: ${{ !matrix.install_linux_deps }}
        run: cargo build --release --target ${{ matrix.target }} -p rfed

      - name: Strip Linux binary
        if: ${{ matrix.install_linux_deps }}
        run: strip ${{ matrix.binary_path }}

      - name: Show binary info
        run: |
          ls -lh ${{ matrix.binary_path }}
          file ${{ matrix.binary_path }}

      - name: Package release archive
        run: |
          ./scripts/package-rfed-release.sh \
            --binary "${{ matrix.binary_path }}" \
            --version "${{ github.ref_name }}" \
            --target "${{ matrix.asset_target }}" \
            --output-dir dist

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: rfed-release-${{ matrix.asset_target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show packaged assets
        run: ls -lh release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true