name: Build fcm_bridge (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'fcm-bridge/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-fcm-bridge.yml'
      - 'build-stamp.rs'
  # A sibling repo's CI can ask for a rebuild (same event rfed listens to).
  repository_dispatch:
    types: [sibling-updated]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build fcm_bridge for Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RFed-rust (this repo)
        uses: actions/checkout@v4

      - name: Bootstrap sibling dependencies (outside workspace)
        run: |
          ./scripts/bootstrap-sibling-deps.sh \
            --deps-root "${{ github.workspace }}/.." \
            --disable-lxmf-reticulum-default-features

      # Record exactly which sibling commits this build resolved to, as the
      # rfed workflow does; build-stamp.rs prefers these over its own git
      # lookups. Without it the image is unattributable.
      - name: Resolve the sibling commits going into this build
        id: stamp
        run: |
          set -euo pipefail
          deps="${{ github.workspace }}/.."
          sha_of() {
            if [ -d "$1/.git" ]; then
              git -C "$1" rev-parse --short=12 HEAD
            else
              echo unknown
            fi
          }
          {
            echo "RFED_BUILD_SHA=$(git rev-parse --short=12 HEAD)"
            echo "RETICULUM_RUST_SHA=$(sha_of "$deps/Reticulum-rust")"
            echo "LXMF_RUST_SHA=$(sha_of "$deps/LXMF-rust")"
            echo "APP_LINKS_SHA=$(sha_of "$deps/app-links")"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
          echo "--- build stamp ---"
          cat "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools perl pkg-config

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fcm-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fcm-musl-

      - name: Build release binary (musl — fully static)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl -p fcm-bridge

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/fcm_bridge

      # "unknown" would leave the image unattributable, so fail instead of shipping it.
      - name: Verify the build stamp
        run: |
          set -euo pipefail
          stamp="$(./target/x86_64-unknown-linux-musl/release/fcm_bridge --build | tail -1)"
          echo "$stamp"
          for component in fcm_bridge reticulum lxmf app_links; do
            case "$stamp" in
              *"${component}=unknown"*)
                echo "::error::${component} did not resolve to a commit"; exit 1 ;;
              *"${component}="*"+dirty"*)
                echo "::error::${component} is dirty in CI, which should be impossible"; exit 1 ;;
              *"${component}="*) ;;
              *)
                echo "::error::${component} missing from the build stamp"; exit 1 ;;
            esac
          done

      - name: Show binary info
        run: |
          ls -lh target/x86_64-unknown-linux-musl/release/fcm_bridge
          file target/x86_64-unknown-linux-musl/release/fcm_bridge
          ldd  target/x86_64-unknown-linux-musl/release/fcm_bridge || true

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcm_bridge-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/fcm_bridge
          retention-days: 30

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy binary into Docker context
        run: cp target/x86_64-unknown-linux-musl/release/fcm_bridge fcm-bridge/fcm_bridge

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: fcm-bridge
          file: fcm-bridge/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fcm_bridge:latest
            ghcr.io/${{ github.repository_owner }}/fcm_bridge:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.retichat.fcm_bridge.sha=${{ steps.stamp.outputs.RFED_BUILD_SHA }}
            com.retichat.reticulum_rust.sha=${{ steps.stamp.outputs.RETICULUM_RUST_SHA }}
            com.retichat.lxmf_rust.sha=${{ steps.stamp.outputs.LXMF_RUST_SHA }}
            com.retichat.app_links.sha=${{ steps.stamp.outputs.APP_LINKS_SHA }}

      - name: Show image digest
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/fcm_bridge:latest"