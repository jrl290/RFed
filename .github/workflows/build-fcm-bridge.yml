name: Build fcm_bridge (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'fcm-bridge/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-fcm-bridge.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build fcm_bridge for Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RFed-rust (this repo)
        uses: actions/checkout@v4

      - name: Bootstrap sibling dependencies (outside workspace)
        run: |
          ./scripts/bootstrap-sibling-deps.sh \
            --deps-root "${{ github.workspace }}/.." \
            --disable-lxmf-reticulum-default-features

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools perl pkg-config

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fcm-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fcm-musl-

      - name: Build release binary (musl — fully static)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl -p fcm-bridge

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/fcm_bridge

      - name: Show binary info
        run: |
          ls -lh target/x86_64-unknown-linux-musl/release/fcm_bridge
          file target/x86_64-unknown-linux-musl/release/fcm_bridge
          ldd  target/x86_64-unknown-linux-musl/release/fcm_bridge || true

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcm_bridge-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/fcm_bridge
          retention-days: 30

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy binary into Docker context
        run: cp target/x86_64-unknown-linux-musl/release/fcm_bridge fcm-bridge/fcm_bridge

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: fcm-bridge
          file: fcm-bridge/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fcm_bridge:latest
            ghcr.io/${{ github.repository_owner }}/fcm_bridge:${{ github.sha }}

      - name: Show image digest
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/fcm_bridge:latest"