name: Build rfed (Linux)

on:
  workflow_dispatch:
  # A sibling repo's CI can ask for a rebuild directly:
  #   gh api repos/<owner>/RFed-rust/dispatches \
  #     -f event_type=sibling-updated
  # This is the mechanism that replaces remembering. Until the sibling repos
  # send it, the drift is at least detectable — see below.
  repository_dispatch:
    types: [sibling-updated]
  push:
    branches: [main, master]
    paths:
      - 'rfed/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-rfed.yml'
  # NOTE: rfed depends on sibling repos (Rusticulum, LXMF-rust, app-links) via
  # path deps cloned at build time. Pushes to those repos do NOT trigger this
  # workflow, and the siblings are cloned at their main-branch HEAD, so a build
  # triggered for an unrelated rfed change also sweeps in whatever landed there
  # since the last build. The deployed binary is therefore a function of when CI
  # last ran, not of any ref.
  #
  # That used to be invisible. Every build now compiles the four commit shas
  # into the binary (rfed/build.rs); `rfed --build` prints them, the startup
  # banner logs them, the CAPABILITIES response returns them, and
  # `scripts/check-sibling-drift.sh` turns them into "N commits behind" against
  # local HEADs. Run that before concluding a fix did not work.
  #
  # The trail of "Trigger:" comments below is what this replaced — each one a
  # rebuild that had to be remembered, with no way to count the ones that were
  # not.
  # Trigger: pick up Reticulum-rust d54bb61 (TCP shutdown-on-write-error reconnect fix).

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build rfed for Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RFed-rust (this repo)
        uses: actions/checkout@v4

      # The crate path deps resolve to sibling repos outside this workspace.
      - name: Bootstrap sibling dependencies (outside workspace)
        run: |
          ./scripts/bootstrap-sibling-deps.sh \
            --deps-root "${{ github.workspace }}/.." \
            --disable-lxmf-reticulum-default-features

      # Record exactly which sibling commits this build resolved to. Without
      # this, the image is unattributable: the siblings are cloned at their
      # main-branch HEAD, so nothing downstream can say what went into it.
      # build.rs prefers these over its own git lookups.
      - name: Resolve the sibling commits going into this build
        id: stamp
        run: |
          set -euo pipefail
          deps="${{ github.workspace }}/.."
          sha_of() {
            if [ -d "$1/.git" ]; then
              git -C "$1" rev-parse --short=12 HEAD
            else
              echo unknown
            fi
          }
          {
            echo "RFED_BUILD_SHA=$(git rev-parse --short=12 HEAD)"
            echo "RETICULUM_RUST_SHA=$(sha_of "$deps/Reticulum-rust")"
            echo "LXMF_RUST_SHA=$(sha_of "$deps/LXMF-rust")"
            echo "APP_LINKS_SHA=$(sha_of "$deps/app-links")"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
          echo "--- build stamp ---"
          cat "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools perl pkg-config

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rfed-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rfed-musl-

      - name: Build release binary (musl — fully static)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl -p rfed

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/rfed

      - name: Show binary info
        run: |
          ls -lh target/x86_64-unknown-linux-musl/release/rfed
          file target/x86_64-unknown-linux-musl/release/rfed
          ldd  target/x86_64-unknown-linux-musl/release/rfed || true

      # Prove the binary can say what it is. A stamp that silently degraded to
      # "unknown" would leave us back where we started, unable to tell what is
      # running on a node, so fail the build instead of shipping it.
      - name: Verify the build stamp
        run: |
          set -euo pipefail
          stamp="$(./target/x86_64-unknown-linux-musl/release/rfed --build | tail -1)"
          echo "$stamp"
          for component in rfed reticulum lxmf app_links; do
            case "$stamp" in
              *"${component}=unknown"*)
                echo "::error::${component} did not resolve to a commit — the image would be unattributable"
                exit 1 ;;
              *"${component}=+dirty"*|*"${component}=unknown+dirty"*)
                echo "::error::${component} is dirty in CI, which should be impossible"
                exit 1 ;;
              *"${component}="*) ;;
              *)
                echo "::error::${component} missing from the build stamp"
                exit 1 ;;
            esac
          done

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfed-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/rfed
          retention-days: 30

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy binary into Docker context
        run: cp target/x86_64-unknown-linux-musl/release/rfed rfed/rfed

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: rfed
          file: rfed/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rfed:latest
            ghcr.io/${{ github.repository_owner }}/rfed:${{ github.sha }}
          # `:latest` alone cannot tell you what a node is running, and the
          # `:${{ github.sha }}` tag only identifies *this* repo — not the three
          # path dependencies compiled into the binary. Label all four so the
          # registry can answer it without pulling the image.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.retichat.rfed.sha=${{ steps.stamp.outputs.RFED_BUILD_SHA }}
            com.retichat.reticulum_rust.sha=${{ steps.stamp.outputs.RETICULUM_RUST_SHA }}
            com.retichat.lxmf_rust.sha=${{ steps.stamp.outputs.LXMF_RUST_SHA }}
            com.retichat.app_links.sha=${{ steps.stamp.outputs.APP_LINKS_SHA }}

      - name: Show image digest
        run: |
          echo "Pushed ghcr.io/${{ github.repository_owner }}/rfed:latest"
          echo "  rfed          ${{ steps.stamp.outputs.RFED_BUILD_SHA }}"
          echo "  reticulum_rust ${{ steps.stamp.outputs.RETICULUM_RUST_SHA }}"
          echo "  lxmf_rust     ${{ steps.stamp.outputs.LXMF_RUST_SHA }}"
          echo "  app_links     ${{ steps.stamp.outputs.APP_LINKS_SHA }}"
          echo
          echo "On the node:   docker run --rm ghcr.io/${{ github.repository_owner }}/rfed:latest --build"
          echo "Locally:       ./scripts/check-sibling-drift.sh --stamp \"\$(that output)\""
