name: Build apns_bridge (Linux)

# Run manually from the Actions tab, or automatically on push to main
# that touches the apns-bridge source.
on:
  workflow_dispatch:
    inputs:
      reticulum_ref:
        description: Rusticulum ref to build against (branch, tag, or commit)
        required: false
        default: ''
      lxmf_ref:
        description: LXMF-rust ref to build against (branch, tag, or commit)
        required: false
        default: ''
      app_links_ref:
        description: app-links ref to build against (branch, tag, or commit)
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'apns-bridge/**'
      - '.github/workflows/build-apns-bridge.yml'

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io

jobs:
  build:
    name: Build apns_bridge for Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RFed-rust (this repo)
        uses: actions/checkout@v4

      - name: Resolve sibling dependency refs
        shell: bash
        run: |
          set -euo pipefail

          source apns-bridge/dependency-refs.env

          if [[ -n "${{ inputs.reticulum_ref }}" ]]; then
            RETICULUM_REF="${{ inputs.reticulum_ref }}"
          fi
          if [[ -n "${{ inputs.lxmf_ref }}" ]]; then
            LXMF_REF="${{ inputs.lxmf_ref }}"
          fi
          if [[ -n "${{ inputs.app_links_ref }}" ]]; then
            APP_LINKS_REF="${{ inputs.app_links_ref }}"
          fi

          {
            echo "RETICULUM_REPO=$RETICULUM_REPO"
            echo "RETICULUM_REF=$RETICULUM_REF"
            echo "LXMF_REPO=$LXMF_REPO"
            echo "LXMF_REF=$LXMF_REF"
            echo "APP_LINKS_REPO=$APP_LINKS_REPO"
            echo "APP_LINKS_REF=$APP_LINKS_REF"
          } >> "$GITHUB_ENV"

      # The crate path deps resolve to sibling repos outside this workspace:
      # apns-bridge -> ../../Reticulum-rust, and LXMF-rust -> ../app-links.
      # From apns-bridge/Cargo.toml that ultimately means:
      #   $GITHUB_WORKSPACE/../Reticulum-rust = /home/runner/work/RFed/Reticulum-rust
      #   $GITHUB_WORKSPACE/../LXMF-rust      = /home/runner/work/RFed/LXMF-rust
      #   $GITHUB_WORKSPACE/../app-links      = /home/runner/work/RFed/app-links
      # actions/checkout refuses paths outside the workspace, so we use git clone.
      - name: Clone sibling dependencies (outside workspace)
        shell: bash
        run: |
          set -euo pipefail

          checkout_ref() {
            local repo="$1"
            local ref="$2"
            local target="$3"

            rm -rf "$target"
            git init "$target"
            git -C "$target" remote add origin "$repo"
            git -C "$target" fetch --depth 1 origin "$ref"
            git -C "$target" checkout --detach FETCH_HEAD
          }

          checkout_ref "$RETICULUM_REPO" "$RETICULUM_REF" "${{ github.workspace }}/../Reticulum-rust"
          checkout_ref "$LXMF_REPO" "$LXMF_REF" "${{ github.workspace }}/../LXMF-rust"
          checkout_ref "$APP_LINKS_REPO" "$APP_LINKS_REF" "${{ github.workspace }}/../app-links"

          {
            echo "RETICULUM_RESOLVED_SHA=$(git -C "${{ github.workspace }}/../Reticulum-rust" rev-parse HEAD)"
            echo "LXMF_RESOLVED_SHA=$(git -C "${{ github.workspace }}/../LXMF-rust" rev-parse HEAD)"
            echo "APP_LINKS_RESOLVED_SHA=$(git -C "${{ github.workspace }}/../app-links" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Show sibling dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "Rusticulum : $RETICULUM_REF -> $RETICULUM_RESOLVED_SHA"
          echo "LXMF-rust  : $LXMF_REF -> $LXMF_RESOLVED_SHA"
          echo "app-links  : $APP_LINKS_REF -> $APP_LINKS_RESOLVED_SHA"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # musl-tools provides musl-gcc for the fully-static musl target.
          # perl is required by the vendored OpenSSL build in openssl-sys.
          sudo apt-get install -y --no-install-recommends musl-tools perl pkg-config

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-apns-bridge-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-apns-bridge-musl-

      - name: Build release binary (musl — fully static, no glibc dependency)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl -p apns-bridge

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/apns_bridge

      - name: Show binary info
        run: |
          ls -lh target/x86_64-unknown-linux-musl/release/apns_bridge
          file target/x86_64-unknown-linux-musl/release/apns_bridge
          ldd  target/x86_64-unknown-linux-musl/release/apns_bridge || true

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apns_bridge-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/apns_bridge
          retention-days: 30

      # ── Optional: copy the example config alongside the binary ──────────────
      - name: Upload config example
        uses: actions/upload-artifact@v4
        with:
          name: apns_bridge-config-example
          path: utilities/apns_bridge.conf.example
          retention-days: 30

      # ── Build and push Docker image to ghcr.io ────────────────────────────
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy binary into Docker context
        run: cp target/x86_64-unknown-linux-musl/release/apns_bridge apns-bridge/apns_bridge

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apns-bridge
          file: apns-bridge/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.reticulum.ref=${{ env.RETICULUM_REF }}
            io.reticulum.sha=${{ env.RETICULUM_RESOLVED_SHA }}
            io.lxmf.ref=${{ env.LXMF_REF }}
            io.lxmf.sha=${{ env.LXMF_RESOLVED_SHA }}
            io.app-links.ref=${{ env.APP_LINKS_REF }}
            io.app-links.sha=${{ env.APP_LINKS_RESOLVED_SHA }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/apns_bridge:latest
            ghcr.io/${{ github.repository_owner }}/apns_bridge:${{ github.sha }}

      - name: Show image digest
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/apns_bridge:latest"
