# rfed.toml — External rnsd integration test configuration
# Connects to rnsd at 192.168.2.107:4242

[node]
name                      = "rfed-ext-test"
announce_interval_minutes = 1
announce_at_start         = true

[storage]
limit_mb = 100

[policy.default]
stamp_cost                = 0
stamp_flexibility         = 0
allow_notify_registration = true
allow_subscription        = true

[policy.vip]
stamp_cost                = 0
stamp_flexibility         = 0
allow_notify_registration = true
allow_subscription        = true
