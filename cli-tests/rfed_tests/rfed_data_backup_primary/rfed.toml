# rfed.toml for backup-test PRIMARY node
# cd6266f8c880d5627c133d2a569711cf is replaced by setup_backup_nodes.sh with the actual backup node hash.

[node]
name                      = "rfed-backup-primary"
announce_interval_minutes = 60     # long interval: primary only announces at startup
announce_at_start         = true

[storage]
limit_mb = 100

[peering]
static_peers     = ["cd6266f8c880d5627c133d2a569711cf"]  # needed so primary syncs to backup node
from_static_only = false
primary_node     = "cd6266f8c880d5627c133d2a569711cf"    # push backup subscriptions here
backup_tick_secs = 8                     # fast backup push tick for tests
owner_offline_secs = 12.0               # consider primary offline after 12s silence

[policy.default]
stamp_cost              = 0
stamp_flexibility       = 0
allow_notify_registration = true
allow_subscription      = true
