# rfed FCM Push Bridge — Configuration
# Copy this file to fcm_bridge.conf and fill in the values.
#
# This file uses Reticulum's native config format.
# The [reticulum] and [interfaces] sections are read by Reticulum directly.
# The remaining sections are bridge-specific.

[reticulum]
	share_instance = No
	enable_transport = No
	panic_on_interface_error = No

[interfaces]

	[[Beleth TCP Transport]]
		type = TCPClientInterface
		enabled = Yes
		target_host = rns.beleth.net
		target_port = 4242

[bridge]

# Path where the bridge's Reticulum identity key is stored.
# On first run a new identity is created automatically.
identity_path = /data/identity

# SQLite database for subscriber_hash → FCM token mappings.
db_path = /data/tokens.db

[fcm]

# Path to the service-account JSON file downloaded for the Firebase project.
service_account_key = /data/firebase-service-account.json

# Android applicationId / package name allowed to receive the wake push.
app_package_name = com.newendian.retichat

# How long (seconds) to cache the Google OAuth assertion before regenerating it.
token_ttl = 3000