[package]
name = "fcm-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fcm_bridge"
path = "src/main.rs"

[dependencies]
reticulum_rust = { path = "../../Reticulum-rust", default-features = false }
app_links = { path = "../../app-links" }

rmpv = "=1.0.0"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "blocking", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
configparser = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
openssl = { version = "0.10", features = ["vendored"] }
hex = "0.4"
log = "0.4"
env_logger = "0.11"

x25519-dalek = "=1.1.1"
ed25519-dalek = "=1.0.1"